{% load i18n %}
<link rel="canonical" href="{{ canonical_url }}">
<link rel="alternate" hreflang="en" href="{{ absolute_language_urls.en }}">
<link rel="alternate" hreflang="ar" href="{{ absolute_language_urls.ar }}">
<link rel="alternate" hreflang="zh-Hans" href="{{ absolute_language_urls.zh_hans }}">
<link rel="alternate" hreflang="x-default" href="{{ absolute_language_urls.en }}">
<meta property="og:locale" content="{% if LANGUAGE_CODE == 'ar' %}ar_SA{% elif LANGUAGE_CODE == 'zh-hans' %}zh_CN{% else %}en_US{% endif %}">
{% if LANGUAGE_CODE == 'ar' %}
<meta property="og:locale:alternate" content="en_US">
<meta property="og:locale:alternate" content="zh_CN">
{% elif LANGUAGE_CODE == 'zh-hans' %}
<meta property="og:locale:alternate" content="en_US">
<meta property="og:locale:alternate" content="ar_SA">
{% else %}
<meta property="og:locale:alternate" content="ar_SA">
<meta property="og:locale:alternate" content="zh_CN">
{% endif %}
