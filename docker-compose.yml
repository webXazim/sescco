services:
  web:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      OPTIMIZE_PUBLIC_IMAGES: "0"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    stop_grace_period: 30s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    ports:
      # For the first/only public site use 0.0.0.0 with ports 80/443.
      # Behind a shared host proxy use 127.0.0.1 and unique ports per site.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-company_profile}
      POSTGRES_USER: ${POSTGRES_USER:-company_profile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_profile}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s

volumes:
  postgres_data:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
